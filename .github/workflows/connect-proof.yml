name: connect-proof (scratch, #284)

# SCRATCH ONLY (never merged): runs the release binary on real macOS, Windows and Linux runners,
# opens a Connect window on pages that fail (TLS, DNS) and records when the wait ends.

on:
  push:
    branches: ["scratch/connect-proof-*"]
  workflow_dispatch:

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils xvfb
      - run: pnpm install --frozen-lockfile
      - name: Release binary (the release workflow's build)
        run: pnpm -C apps/desktop tauri build --features ml --no-bundle
      - name: Connect windows on failing pages
        shell: bash
        run: |
          bin=target/release/mangas; [ "$RUNNER_OS" = Windows ] && bin=target/release/mangas.exe
          git log -1 --format='head %H %s'
          fail=0
          for url in https://self-signed.badssl.com/ https://expired.badssl.com/ https://wrong.host.badssl.com/ https://untrusted-root.badssl.com/ https://nonexistent-host.invalid/; do
            out="$RUNNER_TEMP/proof-$(printf %s "$url" | tr -c 'a-z0-9' '_').log"
            if [ "$RUNNER_OS" = Linux ]; then
              MANGAS_SCRATCH_CONNECT_URL="$url" MANGAS_SCRATCH_OUT="$out" xvfb-run -a "$bin" >/dev/null 2>&1 &
            else
              MANGAS_SCRATCH_CONNECT_URL="$url" MANGAS_SCRATCH_OUT="$out" "$bin" >/dev/null 2>&1 &
            fi
            pid=$!
            for _ in $(seq 120); do grep -qE '"closed"|TIMEOUT|not opened' "$out" 2>/dev/null && break; sleep 0.25; done
            kill "$pid" 2>/dev/null || true
            [ "$RUNNER_OS" = Windows ] && taskkill //F //IM mangas.exe >/dev/null 2>&1 || true
            sleep 1
            echo "== $url"; cat "$out" 2>/dev/null || echo "no output"
            { echo "### $url"; echo '```'; cat "$out" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            grep -q '"kind":"failed"' "$out" 2>/dev/null || fail=1
          done
          exit $fail
