name: Live smoke

# Manual: runs the provider contract and `providers check` against the real sites. MangaDot is
# behind a Cloudflare verification that CI cannot pass, so only MangaDex, WeebCentral, Tapas and
# Webtoons run here.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mangadex:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Contract tests (live)
        env:
          MANGAS_LIVE: "1"
        run: cargo test -p mangas-providers --test live -- --ignored --nocapture mangadex
      - name: providers check mangadex
        run: cargo run -q -p mangas-cli -- providers check mangadex

  weebcentral:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
