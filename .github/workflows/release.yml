name: Release

# Two ways in:
#   - workflow_dispatch: bump from conventional commits (rc or stable), update CHANGELOG.md,
#     commit + tag, then build.
#   - push of a v* tag made by hand: build only.
# Pre-release tags (v1.8.3-rc.2) publish as GitHub pre-releases; v1.8.3 as full releases.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "rc: next release candidate; stable: full release"
        type: choice
        options: [rc, stable]
        default: rc
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN pushes do not trigger workflows, so build runs in this workflow instead.
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'workflow_dispatch'
      - uses: taiki-e/install-action@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tool: git-cliff
      - name: Bump, changelog, tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          v="$(scripts/next-version.sh "${{ inputs.channel }}")"
          scripts/set-version.sh "$v"
          git cliff --tag "v$v" -o CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$v"
          git tag -a "v$v" -m "v$v"
          git push --follow-tags origin HEAD:${GITHUB_REF_NAME}
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          # Linux binaries need the glibc of the runner they are built on: keep the oldest
          # runner that still ships webkit2gtk-4.1 (22.04, glibc 2.35).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      GLIBC_FLOOR: "2.35"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils
      - name: Runner glibc within the floor
        if: runner.os == 'Linux'
        run: |
          have="$(getconf GNU_LIBC_VERSION | cut -d' ' -f2)"
          echo "runner glibc $have, floor $GLIBC_FLOOR"
          if [[ "$(printf '%s\n' "$have" "$GLIBC_FLOOR" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]]; then
            echo "::error::runner glibc $have is newer than the $GLIBC_FLOOR floor"; exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Release notes
        id: notes
        shell: bash
        run: |
          { echo 'body<<EOF'; git cliff --latest --strip all; echo EOF; } >> "$GITHUB_OUTPUT"
      - name: Apple signing secrets
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          delimiter="$(openssl rand -hex 16)"
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "${!name}" "$delimiter" >> "$GITHUB_ENV"
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --features ml
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Mangas ${{ needs.version.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(needs.version.outputs.tag, '-rc.') }}
      - name: Binary glibc within the floor
        if: runner.os == 'Linux'
        run: |
          bin="target/${{ matrix.target }}/release/mangas"
          need="$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | cut -d_ -f2 | sort -uV | tail -1)"
          echo "$bin needs glibc $need, floor $GLIBC_FLOOR"
          if [[ "$(printf '%s\n' "$need" "$GLIBC_FLOOR" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]]; then
            echo "::error::$bin needs glibc $need, newer than the $GLIBC_FLOOR floor"; exit 1
          fi
