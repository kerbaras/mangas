name: Pages

# Builds apps/web and publishes it to https://kerbaras.github.io/mangas. The site also reads the
# desktop tokens and icon, so changes there redeploy it too.
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/desktop/src/styles/tokens.css
      - apps/desktop/src-tauri/icons/**
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @mangas/web...
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: pnpm -C apps/web build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
