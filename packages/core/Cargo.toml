[package]
name = "mangas-core"
description = "Mangas core: sources, library, downloads, EPUB/Kindle export, smart cut and ML detectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mangas_core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
fast_image_resize = { version = "5", features = ["image"] }
rayon = "1"
sha2 = "0.10"
futures-util = "0.3"
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls", "copy-dylibs"] }
ndarray = { version = "0.17", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
url = "2"
futures = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[features]
default = []
# Enables the ONNX detectors (ort). Off by default so the core builds without ONNX Runtime.
ml = ["dep:ort", "dep:ndarray"]
cuda = ["ml", "ort/cuda"]

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["coreml"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["directml"] }

[dev-dependencies]
roxmltree = "0.20"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
