[package]
name = "mangas-core"
description = "mangas core: sources, library, downloads, EPUB/Kindle export, smart cut and ML detectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mangas_core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
fast_image_resize = { version = "5", features = ["image"] }
png = "0.18"
rayon = "1"
sha2 = "0.10"
semver = "1"
base64 = "0.22"
uuid = { version = "1", default-features = false, features = ["v5"] }
futures-util = "0.3"
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic"] }
libloading = { version = "0.9", optional = true }
ndarray = { version = "0.17", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
url = "2"
futures = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
pdf-writer = "0.15"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
# Tells a webview TLS failure caused by an empty system store from a bad certificate.
rustls-native-certs = "0.8"
tempfile = "3"
# OS keychain for the SMTP password: macOS Keychain, Windows Credential Manager, Secret Service
# over zbus on Linux (pure Rust, no libdbus).
keyring = "4.2"

[features]
default = []
# Enables the ONNX detectors (ort, `load-dynamic`): the ONNX Runtime library is downloaded at
# runtime next to the models (see `ml::runtime`), so no build machine needs it.
ml = ["dep:ort", "dep:ndarray", "dep:libloading"]
cuda = ["ml", "ort/cuda"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["coreml"] }

[dev-dependencies]
lopdf = "0.45"
roxmltree = "0.21.1"
tokio = { workspace = true, features = ["net", "io-util"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
