[package]
name = "mangas-providers"
description = "mangas providers: MangaDex, MangaDot, WeebCentral and the common harness (SiteClient, HostPolicy, registry) behind the core Source trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mangas_providers"

[dependencies]
mangas-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "system-proxy"] }
url = "2"
http = "1"
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy", "client-proxy-system"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
scraper = "0.27"
html-escape = "0.2"
prost = "0.14"
uuid = { version = "1", default-features = false, features = ["v4"] }

[build-dependencies]
prost-build = "0.14"
protox = "0.10"

[features]
# Test-only constructors (`PageClient::resolving_to`) for this crate's integration tests.
test-support = []

[dev-dependencies]
# The self-signed TLS test server (`tests/tls_server.rs`); the provider reqwest already uses.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
mangas-providers = { path = ".", features = ["test-support"] }
tempfile = "3"
tracing-subscriber = { workspace = true }
wiremock = "0.6"
