[package]
name = "mangas-providers"
description = "Mangas providers: MangaDex, MangaDot, WeebCentral and the common harness (SiteClient, HostPolicy, registry) behind the core Source trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mangas_providers"

[dependencies]
mangas-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
scraper = "0.27"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
