[package]
name = "mangas-cli"
description = "Mangas CLI: search, follow, download and export manga from the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mangas_cli"
path = "src/lib.rs"

[[bin]]
name = "mangas-cli"
path = "src/main.rs"

[dependencies]
mangas-core = { path = "../../packages/core" }
mangas-providers = { path = "../../packages/providers" }
anyhow = { workspace = true }
tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
directories = "6"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = []
# ONNX detectors for smart cutting (ONNX Runtime is downloaded on demand by `mangas ml download`).
ml = ["mangas-core/ml"]
cuda = ["mangas-core/cuda"]
