[package]
name = "mangas-desktop"
description = "mangas desktop: Tauri shell around mangas-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mangas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The shipped executable: `mangas` with arguments runs the CLI, without them opens the app.
[[bin]]
name = "mangas"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mangas-core = { path = "../../../packages/core" }
mangas-providers = { path = "../../../packages/providers" }
mangas-cli = { path = "../../cli" }
tokio = { workspace = true }
anyhow = { workspace = true }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Minor pinned to match @tauri-apps/plugin-clipboard-manager (Tauri CLI checks they agree).
tauri-plugin-clipboard-manager = "~2.3"
# Sent from Rust (one notification per update check). Its injected `window.Notification` script
# still asks `is_permission_granted` on load, so the capability grants only that.
tauri-plugin-notification = "2"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
directories = "6"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-updater = "2.12"
tauri-plugin-window-state = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
tracing-subscriber = { workspace = true }

# The Connect window's page-load failures (`connect_window`); the version wry already uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[features]
default = []
ml = ["mangas-core/ml", "mangas-cli/ml"]
cuda = ["mangas-core/cuda", "mangas-cli/cuda"]
