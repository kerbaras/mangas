[package]
name = "mangas-desktop"
description = "Mangas desktop: Tauri shell around mangas-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mangas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The shipped executable: `mangas` with arguments runs the CLI, without them opens the app.
[[bin]]
name = "mangas"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mangas-core = { path = "../../../packages/core" }
mangas-providers = { path = "../../../packages/providers" }
mangas-cli = { path = "../../cli" }
tokio = { workspace = true }
anyhow = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
directories = "6"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[features]
default = []
ml = ["mangas-core/ml", "mangas-cli/ml"]
cuda = ["mangas-core/cuda", "mangas-cli/cuda"]
