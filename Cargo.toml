[workspace]
resolver = "2"
members = ["packages/core", "packages/providers", "apps/cli", "apps/desktop/src-tauri"]
# The desktop shell needs the Tauri system libraries; build it explicitly with `-p mangas-desktop`.
default-members = ["packages/core", "packages/providers", "apps/cli"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "tracing-log", "std"] }
tracing-appender = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
