[workspace]
resolver = "2"
members = ["packages/core", "packages/providers", "apps/cli", "apps/desktop/src-tauri"]
# The desktop shell needs the Tauri system libraries; build it explicitly with `-p mangas-desktop`.
default-members = ["packages/core", "packages/providers", "apps/cli"]

[workspace.package]
version = "0.1.0-rc.3"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
