[package]
name = "mangas-core"
description = "Mangas core: sources, library, downloads, EPUB/Kindle export, smart cut and ML detectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mangas_core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
url = "2"

[features]
default = []
# Enables the ONNX detectors (ort). Off by default so the core builds without ONNX Runtime.
ml = []
cuda = ["ml"]

[dev-dependencies]
tempfile = "3"
